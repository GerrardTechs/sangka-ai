<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Analisis Limbah Pisang & Nangka</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e9f5ec;
    --mint: #d6f0e0;
    --emerald: #34a672;
    --emerald-dark: #1f7a52;
    --emerald-deep: #0f5c3d;
    --text-dark: #163a2c;
    --text-soft: #5d7d6d;
    --clay-light: #ffffff;
    --clay-shadow-dark: rgba(31, 90, 63, 0.28);
    --clay-shadow-light: rgba(255, 255, 255, 0.85);
    --card-radius: 28px;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(160deg, #eafaf0 0%, #d9f0e2 45%, #cdeadb 100%);
    color: var(--text-dark);
    min-height: 100%;
    padding: env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px);
    display: flex;
    justify-content: center;
  }

  .app {
    width: 100%;
    max-width: 430px;
    padding: 22px 18px 40px;
  }

  /* ---------- Header ---------- */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .header .greeting h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0;
    line-height: 1.25;
    color: var(--text-dark);
  }

  .header .greeting p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--text-soft);
    font-weight: 500;
  }

  .header .icons {
    display: flex;
    gap: 10px;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 16px;
    border: none;
    background: var(--mint);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 6px 6px 12px var(--clay-shadow-dark), -6px -6px 12px var(--clay-shadow-light);
    cursor: pointer;
    color: var(--emerald-deep);
  }

  /* ---------- Camera Hero Card ---------- */
  .hero-card {
    position: relative;
    border-radius: var(--card-radius);
    overflow: hidden;
    aspect-ratio: 4 / 5;
    background: #0f2e21;
    box-shadow: 10px 10px 22px var(--clay-shadow-dark), -10px -10px 22px var(--clay-shadow-light);
    display: flex;
    align-items: flex-end;
  }

  .hero-card video,
  .hero-card img.captured {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .hero-card .placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: #bfe6cf;
    text-align: center;
    padding: 24px;
  }

  .hero-card .placeholder svg { opacity: 0.85; }

  .hero-card .placeholder p {
    font-size: 13px;
    font-weight: 500;
    margin: 0;
    color: #cfeedb;
  }

  .tag-chip {
    position: absolute;
    top: 14px;
    left: 14px;
    background: rgba(15, 46, 33, 0.55);
    backdrop-filter: blur(6px);
    color: #e9fbef;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    z-index: 2;
  }

  .shutter-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  .shutter-btn {
    width: 58px;
    height: 58px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.85);
    background: var(--emerald);
    box-shadow: 0 8px 18px rgba(0,0,0,0.35);
    cursor: pointer;
  }

  .shutter-btn:active { transform: scale(0.94); }

  /* ---------- Action Row ---------- */
  .action-row {
    display: grid;
    grid-template-columns: 1fr 1.3fr 1fr;
    gap: 12px;
    margin-top: 18px;
  }

  .action-card {
    background: var(--mint);
    border: none;
    border-radius: 20px;
    padding: 14px 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--emerald-deep);
    box-shadow: 6px 6px 14px var(--clay-shadow-dark), -6px -6px 14px var(--clay-shadow-light);
    cursor: pointer;
    transition: transform 0.15s ease;
  }

  .action-card.primary {
    background: linear-gradient(155deg, #3fbf85, #1f8f5f);
    color: #f2fff8;
    box-shadow: 6px 6px 16px rgba(20, 90, 60, 0.45), -4px -4px 10px rgba(255,255,255,0.35);
  }

  .action-card:active { transform: scale(0.96); }
  .action-card:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }

  input[type="file"] { display: none; }

  /* ---------- Section title ---------- */
  .section-title {
    margin: 26px 0 12px;
    font-size: 15px;
    font-weight: 700;
    color: var(--text-dark);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .section-title span.muted {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-soft);
  }

  /* ---------- Status ---------- */
  .status-box {
    background: var(--clay-light);
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 6px 6px 14px var(--clay-shadow-dark), -6px -6px 14px var(--clay-shadow-light);
    font-size: 13px;
    color: var(--text-soft);
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .spinner {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 3px solid #cfeedb;
    border-top-color: var(--emerald);
    animation: spin 0.8s linear infinite;
    flex-shrink: 0;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .invalid-box {
    background: #fff2ea;
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 6px 6px 14px rgba(214, 138, 90, 0.18), -6px -6px 14px rgba(255,255,255,0.7);
    color: #9a4a1f;
    font-size: 13px;
    font-weight: 500;
  }

  /* ---------- Result cards ---------- */
  .result-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .result-card {
    background: var(--clay-light);
    border-radius: 20px;
    padding: 16px 18px;
    box-shadow: 6px 6px 14px var(--clay-shadow-dark), -6px -6px 14px var(--clay-shadow-light);
    display: flex;
    gap: 14px;
    align-items: flex-start;
  }

  .result-icon {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    background: var(--mint);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    color: var(--emerald-dark);
  }

  .result-body h3 {
    margin: 0 0 4px;
    font-size: 13.5px;
    font-weight: 700;
    color: var(--text-dark);
  }

  .result-body p, .result-body ul {
    margin: 0;
    font-size: 12.5px;
    line-height: 1.55;
    color: var(--text-soft);
  }

  .result-body ul { padding-left: 16px; }
  .result-body b { color: var(--emerald-deep); }

  .badge-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-top: 6px;
  }

  .badge {
    background: var(--mint);
    color: var(--emerald-deep);
    font-size: 11px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }

  .footer-note {
    text-align: center;
    margin-top: 24px;
    font-size: 11px;
    color: var(--text-soft);
    line-height: 1.6;
  }

  @media (prefers-color-scheme: dark) {
    body { background: linear-gradient(160deg, #0d1f17, #10281d); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="header">
    <div class="greeting">
      <h1>Halo,<br/>Pengolah Limbah</h1>
      <p>Foto limbah pisang/nangka-mu</p>
    </div>
    <div class="icons">
      <button class="icon-btn" id="switchCamBtn" title="Ganti kamera">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 4v5h5M20 20v-5h-5M20 9a8 8 0 00-14.9-3M4 15a8 8 0 0014.9 3" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>

  <div class="hero-card" id="heroCard">
    <div class="tag-chip">Kamera Limbah</div>
    <video id="video" autoplay playsinline muted></video>
    <img id="capturedImg" class="captured" style="display:none;" alt="Foto limbah" />
    <div class="placeholder" id="camPlaceholder" style="display:none;">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none"><path d="M4 7h3l2-2h6l2 2h3v13H4V7z" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="13" r="3.5" stroke="currentColor" stroke-width="1.6"/></svg>
      <p>Kamera tidak aktif.<br/>Gunakan tombol "Galeri" di bawah.</p>
    </div>
    <div class="shutter-wrap" id="shutterWrap">
      <button class="shutter-btn" id="shutterBtn" title="Ambil foto"></button>
    </div>
  </div>

  <div class="action-row">
    <button class="action-card" id="galleryBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.7"/><circle cx="8.5" cy="10" r="1.5" fill="currentColor"/><path d="M21 16l-5.5-5-4 4L8 12l-5 5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Galeri
    </button>
    <button class="action-card primary" id="analyzeBtn" disabled>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M12 3v4M12 17v4M3 12h4M17 12h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="2"/></svg>
      Analisis
    </button>
    <button class="action-card" id="resetBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none"><path d="M4 4v6h6M20 20v-6h-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 15a8 8 0 0014.5 3M19 9A8 8 0 004.5 6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Ulangi
    </button>
  </div>

  <input type="file" id="fileInput" accept="image/*" />

  <div class="section-title">
    Hasil Analisis
    <span class="muted" id="greenBadge"></span>
  </div>

  <div id="statusArea"></div>
  <div class="result-list" id="resultArea"></div>

  <p class="footer-note">Diproses dengan Gemini 2.5 Flash via LiteLLM &middot; gambar dikompres otomatis di server untuk efisiensi energi (green computing).</p>

</div>

<script>
const video = document.getElementById('video');
const capturedImg = document.getElementById('capturedImg');
const camPlaceholder = document.getElementById('camPlaceholder');
const shutterWrap = document.getElementById('shutterWrap');
const shutterBtn = document.getElementById('shutterBtn');
const switchCamBtn = document.getElementById('switchCamBtn');
const galleryBtn = document.getElementById('galleryBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const resetBtn = document.getElementById('resetBtn');
const fileInput = document.getElementById('fileInput');
const statusArea = document.getElementById('statusArea');
const resultArea = document.getElementById('resultArea');
const greenBadge = document.getElementById('greenBadge');

let currentStream = null;
let facingMode = 'environment';
let capturedBlob = null;

async function startCamera() {
  try {
    if (currentStream) currentStream.getTracks().forEach(t => t.stop());
    currentStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode }, audio: false
    });
    video.srcObject = currentStream;
    video.style.display = 'block';
    capturedImg.style.display = 'none';
    camPlaceholder.style.display = 'none';
    shutterWrap.style.display = 'flex';
  } catch (err) {
    video.style.display = 'none';
    camPlaceholder.style.display = 'flex';
    shutterWrap.style.display = 'none';
    console.warn('Kamera tidak tersedia:', err.message);
  }
}

function stopCamera() {
  if (currentStream) currentStream.getTracks().forEach(t => t.stop());
  currentStream = null;
}

switchCamBtn.addEventListener('click', () => {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  startCamera();
});

shutterBtn.addEventListener('click', () => {
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  canvas.getContext('2d').drawImage(video, 0, 0);
  canvas.toBlob((blob) => {
    setCapturedImage(blob);
  }, 'image/jpeg', 0.9);
});

galleryBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const file = e.target.files[0];
  if (file) setCapturedImage(file);
});

function setCapturedImage(blob) {
  capturedBlob = blob;
  const url = URL.createObjectURL(blob);
  capturedImg.src = url;
  capturedImg.style.display = 'block';
  video.style.display = 'none';
  camPlaceholder.style.display = 'none';
  shutterWrap.style.display = 'none';
  stopCamera();
  analyzeBtn.disabled = false;
  clearResults();
}

resetBtn.addEventListener('click', () => {
  capturedBlob = null;
  capturedImg.style.display = 'none';
  analyzeBtn.disabled = true;
  clearResults();
  startCamera();
});

function clearResults() {
  statusArea.innerHTML = '';
  resultArea.innerHTML = '';
  greenBadge.textContent = '';
}

analyzeBtn.addEventListener('click', async () => {
  if (!capturedBlob) return;
  analyzeBtn.disabled = true;
  clearResults();
  statusArea.innerHTML = `
    <div class="status-box">
      <div class="spinner"></div>
      <span>Menganalisis limbah... (gambar dikompres dulu supaya hemat energi)</span>
    </div>`;

  try {
    const form = new FormData();
    form.append('image', capturedBlob, 'limbah.jpg');

    const res = await fetch('/api/analyze', { method: 'POST', body: form });
    const data = await res.json();

    statusArea.innerHTML = '';

    if (!data.ok) {
      statusArea.innerHTML = `<div class="invalid-box">⚠️ ${data.error || 'Terjadi kesalahan.'}</div>`;
      analyzeBtn.disabled = false;
      return;
    }

    if (data.green_computing) {
      greenBadge.textContent = `🌱 -${data.green_computing.reduksi_ukuran_persen}% ukuran gambar`;
    }

    if (!data.valid) {
      statusArea.innerHTML = `<div class="invalid-box">🚫 ${data.pesan}</div>`;
      analyzeBtn.disabled = false;
      return;
    }

    renderResult(data.hasil);
  } catch (err) {
    statusArea.innerHTML = `<div class="invalid-box">⚠️ Gagal terhubung ke server: ${err.message}</div>`;
  } finally {
    analyzeBtn.disabled = false;
  }
});

function card(title, iconSvg, bodyHtml) {
  return `<div class="result-card">
    <div class="result-icon">${iconSvg}</div>
    <div class="result-body">
      <h3>${title}</h3>
      ${bodyHtml}
    </div>
  </div>`;
}

const ic = {
  leaf: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M5 21c9 0 14-5 14-14 0-1 0-3-1-4-9 0-13 5-13 13 0 1 0 3 1 5z" stroke="currentColor" stroke-width="1.6"/></svg>',
  scale: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3v18M6 7l-3 6a3 3 0 006 0l-3-6zM18 7l-3 6a3 3 0 006 0l-3-6zM6 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  recycle: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M7 19l-3-3 3-3M17 5l3 3-3 3M4 16h6l3-5M20 8h-6l-3 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  droplet: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3s6 7 6 11a6 6 0 01-12 0c0-4 6-11 6-11z" stroke="currentColor" stroke-width="1.6"/></svg>',
  shield: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 3l7 3v6c0 5-3 8-7 9-4-1-7-4-7-9V6l7-3z" stroke="currentColor" stroke-width="1.6"/></svg>',
  flask: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>',
  cpu: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M9 3v4M15 3v4M9 17v4M15 17v4M3 9h4M3 15h4M17 9h4M17 15h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  chart: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  clock: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v5l3 2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
  route: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="6" cy="6" r="2.5" stroke="currentColor" stroke-width="1.5"/><circle cx="18" cy="18" r="2.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 7c4 0 2 9 8 10" stroke="currentColor" stroke-width="1.5"/></svg>',
  coin: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 7v10M9 10a3 3 0 013-3h.5a2.5 2.5 0 010 5H11a2.5 2.5 0 000 5h1a3 3 0 003-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  trash: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};

function fmtIDR(n) {
  if (typeof n !== 'number') return n;
  return 'Rp' + n.toLocaleString('id-ID');
}

function renderResult(h) {
  let html = '';

  html += card('Ringkasan', ic.leaf, `
    <p><b>${h.jenis_limbah || '-'}</b></p>
    <div class="badge-row">
      <span class="badge">Keyakinan ${h.tingkat_kepercayaan_persen ?? '-'}%</span>
      <span class="badge">Berat &asymp; ${h.estimasi_berat_gram ?? '-'} g</span>
    </div>`);

  if (h.jejak_karbon) html += card('1. Jejak Karbon', ic.leaf, `
    <p><b>${h.jejak_karbon.nilai_kgco2e_per_kg ?? '-'} kg CO2e/kg</b></p>
    <p>${h.jejak_karbon.penjelasan || ''}</p>`);

  if (h.kesegaran) html += card('4. Kesegaran & Pembusukan', ic.droplet, `
    <div class="badge-row"><span class="badge">${h.kesegaran.tingkat || '-'}</span><span class="badge">Skor ${h.kesegaran.skor_0_100 ?? '-'}/100</span></div>
    <p>${h.kesegaran.deskripsi || ''}</p>`);

  if (h.deteksi_kontaminasi) html += card('5. Deteksi Kontaminasi', ic.shield, `
    <p><b>${h.deteksi_kontaminasi.terdeteksi ? 'Terdeteksi benda asing' : 'Tidak ada kontaminasi'}</b></p>
    ${(h.deteksi_kontaminasi.jenis_benda_asing && h.deteksi_kontaminasi.jenis_benda_asing.length) ? '<div class="badge-row">' + h.deteksi_kontaminasi.jenis_benda_asing.map(x => '<span class="badge">'+x+'</span>').join('') + '</div>' : ''}
    <p>${h.deteksi_kontaminasi.catatan || ''}</p>`);

  if (h.optimasi_ekstraksi) html += card('6. Optimasi Parameter Ekstraksi', ic.flask, `
    <div class="badge-row">
      <span class="badge">${h.optimasi_ekstraksi.suhu_celcius ?? '-'} &deg;C</span>
      <span class="badge">${h.optimasi_ekstraksi.waktu_menit ?? '-'} menit</span>
      <span class="badge">${h.optimasi_ekstraksi.energi_kwh ?? '-'} kWh</span>
    </div>
    <p>${h.optimasi_ekstraksi.metode || ''}</p>`);

  if (h.efisiensi_komputasi_model) html += card('7. Efisiensi Komputasi Model', ic.cpu, `
    <p><b>Rekomendasi: ${(h.efisiensi_komputasi_model.rekomendasi || '-').toUpperCase()}</b> &middot; hemat &asymp;${h.efisiensi_komputasi_model.estimasi_hemat_energi_persen ?? '-'}%</p>
    <p>${h.efisiensi_komputasi_model.alasan || ''}</p>`);

  if (h.kadar_biokimia_estimasi) html += card('8. Estimasi Kadar Biokimia', ic.flask, `
    <div class="badge-row">
      <span class="badge">Pektin ${h.kadar_biokimia_estimasi.pektin_persen ?? '-'}%</span>
      <span class="badge">Selulosa ${h.kadar_biokimia_estimasi.selulosa_persen ?? '-'}%</span>
      <span class="badge">Pati ${h.kadar_biokimia_estimasi.pati_persen ?? '-'}%</span>
    </div>`);

  if (h.prediksi_shelflife) html += card('9. Prediksi Waktu Simpan', ic.clock, `
    <p><b>&asymp; ${h.prediksi_shelflife.hari_tersisa ?? '-'} hari tersisa</b></p>
    <p>${h.prediksi_shelflife.catatan || ''}</p>`);

  if (h.optimasi_rute_pengumpulan) html += card('10. Optimasi Rute Pengumpulan', ic.route, `
    <p>${h.optimasi_rute_pengumpulan.rekomendasi || ''}</p>
    <div class="badge-row">
      <span class="badge">&asymp; ${h.optimasi_rute_pengumpulan.estimasi_jarak_km ?? '-'} km</span>
      <span class="badge">${h.optimasi_rute_pengumpulan.moda_transport || '-'}</span>
    </div>`);

  if (h.proyeksi_nilai_tambah_ekonomi) html += card('11. Proyeksi Nilai Tambah Ekonomi', ic.coin, `
    <p><b>${h.proyeksi_nilai_tambah_ekonomi.potensi_produk || '-'}</b></p>
    <p>Estimasi nilai: ${fmtIDR(h.proyeksi_nilai_tambah_ekonomi.estimasi_nilai_rp_per_kg)} / kg</p>`);

  if (h.penghematan_biaya_tpa) html += card('12. Penghematan Biaya TPA', ic.trash, `
    <div class="badge-row">
      <span class="badge">${h.penghematan_biaya_tpa.estimasi_kg_terhindar_dari_tpa ?? '-'} kg terhindar</span>
      <span class="badge">Hemat ${fmtIDR(h.penghematan_biaya_tpa.estimasi_hemat_rp)}</span>
    </div>
    <p>${h.penghematan_biaya_tpa.catatan || ''}</p>`);

  if (h.rekomendasi_pemanfaatan && h.rekomendasi_pemanfaatan.length) html += card('3. Rekomendasi Pemanfaatan', ic.recycle, `
    <ul>${h.rekomendasi_pemanfaatan.map(r => '<li>'+r+'</li>').join('')}</ul>`);

  resultArea.innerHTML = html;
}

startCamera();
</script>
</body>
</html>
